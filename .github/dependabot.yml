# Dependabot version updates.
#
# Updates are grouped (one PR per ecosystem per week) and capped, rather than one
# PR per package. Majors are deliberately left ungrouped: they get their own PR
# so a breaking change never hides inside a batch of patch bumps.
#
# Security updates are separate from this file: they follow the repo's
# Dependabot alerts setting and are not limited by the schedule below.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Madrid }
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
      # Security updates come one PR per vulnerable (often transitive) package
      # by default. Grouped, they arrive as one PR and cost one CI run.
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Madrid }
    groups:
      actions:
        patterns: ["*"]
    commit-message: { prefix: "chore(ci)" }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Madrid }
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      # The runtime Python follows requires-python and what CI tests; a new
      # minor (3.12 -> 3.13) is a deliberate change, not a weekly bump.
      - dependency-name: python
        update-types: [version-update:semver-minor, version-update:semver-major]
    commit-message: { prefix: "chore(docker)" }
