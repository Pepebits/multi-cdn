[project]
name = "multicdn"
version = "0.3.5"
description = "Multi-CDN failover controller and private panel (Cloudflare + Gcore)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "dnspython>=2.6",
    "cryptography>=50.0.2",
    "certbot>=5.9.0",
    "segno>=1.6.6",
    "sentry-sdk>=2.75",
]

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Browser tests (tests/e2e) are slower and need Chromium: run them with `pytest -m e2e`.
addopts = "-m 'not e2e'"
markers = ["e2e: browser tests with Playwright against a running panel"]

[tool.pyright]
# Basic mode over the app code; CI runs it (a pinned pyright, see .github/workflows/ci.yml).
include = ["app"]
typeCheckingMode = "basic"
pythonVersion = "3.15"
