[project]
name = "multicdn"
version = "0.1.0"
description = "Multi-CDN failover controller and private panel (Cloudflare + Gcore)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "dnspython>=2.6",
    "cryptography>=50.0.2",
    "certbot>=5.9.0",
    "segno>=1.6.6",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
