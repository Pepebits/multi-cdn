# docker compose up -d --build   (deploy/install.sh prepares data/ and config/ first)
# El panel queda en 127.0.0.1:8765 del VPS, sin publicar en Internet. Acceso por túnel SSH
# (ssh -N -L 8765:127.0.0.1:8765 <usuario>@<IP>) o Tailscale (sudo tailscale serve --bg 8765).
# Needs Docker Compose 2.24 or later (env_file with `path:`).
services:
  panel:
    # Imagen publicada; `docker compose up -d --build` la construye desde este repo en su lugar.
    image: ghcr.io/pepebits/multi-cdn:latest
    build: .
    container_name: multicdn-panel
    restart: unless-stopped
    # Runs as the user who installed it (deploy/install.sh writes MULTICDN_UID/MULTICDN_GID to .env),
    # so data/ and config/ are simply yours: no ACL, no sudo to edit config/secrets.env. Without
    # them, the image's own user (uid 10001). Never root: install.sh refuses uid 0.
    user: "${MULTICDN_UID:-10001}:${MULTICDN_GID:-10001}"
    env_file:
      # Settings and master key (MULTICDN_SECRET_KEY, MULTICDN_DRY_RUN, ORIGIN_*…): .env in this
      # folder, or the path in MULTICDN_ENV_FILE (set in the environment or in this folder's .env).
      # Only passed as environment: it is not mounted, so the container cannot change it.
      - path: ${MULTICDN_ENV_FILE:-.env}
      # The values the panel manages (tokens, alert channels, DSN) live in config/secrets.env,
      # which is NOT an env_file: the panel reads and writes it itself through the mount below
      # and only accepts its own variables, so nothing written there can change the container's
      # environment (dry run, PYTHONPATH…) or reach Compose.
    environment:
      # Where the panel reads and writes its secrets file: the folder below, mounted read-write
      # (a folder, so the file can be replaced atomically). See deploy/README.md, "Panel secrets file".
      MULTICDN_SECRETS_PATH: /app/config/secrets.env
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/app/data
      - type: bind
        source: ${MULTICDN_SECRETS_DIR:-./config}
        target: /app/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
